name: ingest-announcements

on:
  schedule:
    - cron: "10 23 * * *" # KST 08:10
    - cron: "10 4 * * *" # KST 13:10
    - cron: "10 9 * * *" # KST 18:10
  workflow_dispatch: # 수동 실행 버튼

concurrency: ingest # 겹침 방지(설계서 6-1)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @supabase/realtime-js가 Node 22+의 네이티브 WebSocket을 요구한다(20에서는 실행 자체가 실패함).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/ingest-myhome.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
