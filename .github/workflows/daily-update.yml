name: daily-update

# 매일 공고 갱신: 수집 → 조건 추출 → 자동 승인 (npm run daily:update). project.md 26번.
#
# 마이홈포털·공공데이터포털은 해외 IP를 403으로 막는다(2026-09-06 run 34019835329에서 확인, 8-1절).
# 그래서 KR_RELAY=supabase로 그 요청만 서울 리전 Supabase Edge Function(kr-relay)을 거친다.
# kr-relay가 배포돼 있지 않으면 수집·추출이 "중계기 오류"로 멈추고 공고 데이터는 건드리지 않는다.
#
# 관리자 화면의 "지금 업데이트" 버튼도 이 워크플로를 workflow_dispatch로 실행한다(GITHUB_ACTIONS_TOKEN이 있을 때).
on:
  schedule:
    # GitHub 크론은 UTC이고 정각에는 밀리기 쉬워서 17분에 둔다
    - cron: "17 0 * * *" # KST 09:17
    - cron: "17 9 * * *" # KST 18:17 — Gemini 하루 한도가 초기화된 뒤라 아침에 못 끝낸 추출을 이어서 한다
  workflow_dispatch:

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 밀린 공고가 많으면 추출이 오래 걸린다(건당 30초~1분, Gemini 한도에서 멈춤)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @supabase/realtime-js가 Node 22+의 네이티브 WebSocket을 요구한다(20에서는 실행 자체가 실패함).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run daily:update
        env:
          KR_RELAY: supabase
          KR_RELAY_SECRET: ${{ secrets.KR_RELAY_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-update-log
          path: logs/
          retention-days: 14
